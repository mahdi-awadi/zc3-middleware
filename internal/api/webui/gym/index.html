<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نادي المنارة — إدارة الاشتراكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F5F7;font-family:"IBM Plex Sans Arabic",sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
a{color:#0071E3;text-decoration:none}a:hover{opacity:.7}
input,select,textarea,button{font-family:inherit}
button{all:unset;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #0071E3;outline-offset:1px}
@keyframes ring{0%{transform:scale(.8);opacity:.55}75%{transform:scale(1.5);opacity:0}100%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:16px}
.pillbtn{border-radius:60px;white-space:nowrap;display:grid;place-items:center;font-weight:600}
.blue{background:#0071E3;color:#fff}.blue:hover{background:#0077ED}
.gray{background:#E8E8ED;color:#424245}.gray:hover{background:#D2D2D7}
.field{display:flex;flex-direction:column;gap:7px}
.field>span{font-size:12px;font-weight:600;color:#6E6E73}
.field input,.field textarea{all:unset;background:#F9F9F9;border:1px solid #EDEDED;border-radius:6px;height:40px;padding:0 12px;font-size:13.5px;color:#1D1D1F}
.field textarea{height:auto;padding:10px 12px;resize:none}
.chip{font-size:11.5px;font-weight:600;border-radius:40px;padding:3px 10px}
.avatar{border-radius:50%;background:#E8E8ED;color:#6E6E73;display:grid;place-items:center;font-weight:600;flex:none}
.thead,.trow{display:grid;gap:16px;padding:14px 24px;border-bottom:1px solid #EDEDED;align-items:center}
.thead{font-size:12px;font-weight:600;color:#6E6E73}
.trow{cursor:pointer;transition:background 300ms}.trow:hover{background:#F9F9F9}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:grid;place-items:center;padding:24px}
.modal{width:420px;max-width:100%;background:#fff;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:16px;animation:fadeUp 300ms ease}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= state & helpers ================= */
const S = {
  screen: 'login', memberId: null, tab: 'all', evTab: 'الكل', gate: 'idle',
  months: 3, access: 'gym_classes', pay: 'cash', discount: 0, priceEdited: 0,
  scan: null, pendingCard: '', unlink: false, freeze: false, edit: false,
  q: '', cfg: null, gymcfg: null, summary: null, members: [], member: null,
  cards: [], feed: [], attendance: [], history: [], gateData: null, gateTimer: null,
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (n) => Number(n || 0).toLocaleString('en-US');
const key = () => localStorage.getItem('zc3_gym_key') || '';
const AR = {
  status: {active:'نشط', expiring:'ينتهي قريباً', expired:'منتهٍ', frozen:'مجمّد', none:'بلا اشتراك'},
  access: {gym:'صالة فقط', gym_classes:'صالة + حصص', full:'كامل الوصول'},
  pay: {cash:'نقد', card:'بطاقة مصرفية', transfer:'تحويل'},
  cardStatus: {linked:'مرتبطة', blank:'فارغة', suspended:'موقوفة', lost:'مفقودة'},
  result: {granted:'مسموح', warn:'تنبيه', denied:'مرفوض', unknown:'مرفوض'},
  day: ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],
};
const statusChip = (s) => ({active:['#D8F3C9','#1D1D1F'], expiring:['#E8F4FD','#0071E3'], expired:['#FFF5F5','#E85F46'], frozen:['#E8E8ED','#6E6E73'], none:['#E8E8ED','#6E6E73']}[s] || ['#E8E8ED','#6E6E73']);
const resultChip = (r) => ({granted:['#D8F3C9','#1D1D1F'], warn:['#E8F4FD','#0071E3'], denied:['#FFF5F5','#E85F46'], unknown:['#FFF5F5','#E85F46']}[r] || ['#E8E8ED','#6E6E73']);
const cardChip = (s) => ({linked:['#D8F3C9','#1D1D1F'], blank:['#E8F4FD','#0071E3'], suspended:['#E8E8ED','#6E6E73'], lost:['#FFF5F5','#E85F46']}[s] || ['#E8E8ED','#6E6E73']);
const initials = (name) => { const p = String(name||'').trim().split(/\s+/); if (!p[0]) return '—'; return p.length>1 ? p[0][0]+'.'+p[p.length-1][0] : p[0][0]; };
const dmy = (iso) => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d) || d.getFullYear() < 1980) return '—'; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
const hm = (iso) => { const d = new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const when = (iso) => { const d = new Date(iso), t = new Date(); const same = (a,b)=>a.toDateString()===b.toDateString(); const y = new Date(t); y.setDate(t.getDate()-1); if (same(d,t)) return 'اليوم '+hm(iso); if (same(d,y)) return 'أمس '+hm(iso); return dmy(iso); };
const serial4 = (s) => { s = String(s||''); return s.length>4 ? s.replace(/(\d{4})(?=\d)/g,'$1 · ') : s; };

async function api(path, opts={}) {
  opts.headers = Object.assign({}, opts.headers);
  if (key()) opts.headers['Authorization'] = 'Bearer ' + key();
  if (opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type'] = 'application/json';
  const res = await fetch(path, opts);
  if (res.status === 401) { S.screen = 'login'; render(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const toast = (msg, bad) => { const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:26px;right:50%;transform:translateX(50%);z-index:200;background:'+(bad?'#E85F46':'#1D1D1F')+';color:#fff;border-radius:60px;padding:10px 22px;font-size:13px;font-weight:600;animation:fadeUp 300ms ease';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

/* ================= data loading ================= */
async function loadCommon() {
  S.cfg = await fetch('/config').then(r => r.json()).catch(() => null);
  S.gymcfg = await api('/gym/config').catch(() => null);
  S.summary = await api('/gym/summary').catch(() => null);
}
async function go(screen, id) {
  S.screen = screen; if (id) S.memberId = id;
  S.unlink = S.freeze = S.edit = false;
  try {
    if (screen !== 'login' && screen !== 'gate' && !S.summary) await loadCommon();
    if (screen === 'dash') { S.summary = await api('/gym/summary'); S.feed = await api('/gym/checkins?limit=6'); }
    if (screen === 'members') { S.members = await api('/gym/members'); }
    if (screen === 'profile') {
      S.member = await api('/gym/members/' + S.memberId);
      S.attendance = await api('/gym/members/' + S.memberId + '/attendance?weeks=16');
      S.history = await api('/gym/members/' + S.memberId + '/checkins?limit=40');
    }
    if (screen === 'cards') { S.cards = await api('/gym/cards'); S.members = await api('/gym/members'); }
    if (screen === 'renew') { S.member = await api('/gym/members/' + S.memberId); S.gymcfg = await api('/gym/config');
      const sub = S.member.subs && S.member.subs[S.member.subs.length-1];
      if (sub) { S.access = sub.access; S.months = sub.months; } S.discount = 0; S.priceEdited = 0; S.pay = 'cash'; }
    if (screen === 'add') { S.pendingCard = ''; S.scan = null; S.months = 3; S.access = 'gym_classes'; S.priceEdited = 0; await api('/gym/scan', {method:'DELETE'}).catch(()=>{}); }
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message, true); }
  render();
}

/* ================= layout ================= */
function render() {
  stopTimers();
  const app = $('app');
  if (S.screen === 'login') { app.innerHTML = loginView(); wireLogin(); return; }
  if (S.screen === 'gate')  { app.innerHTML = gateView();  wireGate();  return; }
  const titles = {dash:'لوحة التحكم', members:'الأعضاء والاشتراكات', add:'إضافة عضو جديد', profile:'ملف العضو', cards:'إدارة البطاقات', renew:'تجديد ودفع'};
  const nav = [
    ['dash','لوحة التحكم',''], ['members','الأعضاء', S.summary ? fmtN(S.summary.total_members) : ''],
    ['add','عضو جديد',''], ['cards','البطاقات', S.summary ? fmtN(S.summary.cards_blank) : ''],
    ['gate','شاشة البوابة',''],
  ];
  const connected = S.cfg && S.cfg.panel_connected;
  app.innerHTML = `
<div style="display:flex;min-height:100vh;align-items:stretch">
  <aside style="width:252px;flex:none;background:#fff;border-inline-end:1px solid #EDEDED;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh">
    <div style="display:flex;align-items:center;gap:11px;padding:4px 8px 22px">
      <div style="width:34px;height:34px;border-radius:10px;background:#1D1D1F;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700">ن</div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <div style="font-size:15px;font-weight:600">نادي المنارة</div>
        <div style="font-size:11.5px;color:#6E6E73">إدارة الاشتراكات</div>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      ${nav.map(([k, label, count]) => `
      <button data-nav="${k}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;background:${S.screen===k?'#F5F5F7':'transparent'};color:${S.screen===k?'#1D1D1F':'#6E6E73'};transition:background 300ms">
        <span style="width:6px;height:6px;border-radius:50%;flex:none;background:${S.screen===k?'#0071E3':'#D2D2D7'}"></span>
        <span>${label}</span>
        ${count ? `<span style="margin-inline-start:auto;font-size:11.5px;font-weight:600;color:#6E6E73;background:#F5F5F7;border-radius:40px;padding:2px 8px">${count}</span>` : ''}
      </button>`).join('')}
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <div style="background:#F5F5F7;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:7px;height:7px;border-radius:50%;background:${connected?'#518339':'#E85F46'}"></span>
          <span style="font-size:12px;font-weight:600">${connected?'قارئ البطاقات متصل':'القارئ غير متصل'}</span>
        </div>
        <div style="font-size:11.5px;color:#6E6E73;line-height:1.5">${connected?'C3 · البوابة الرئيسية':'يعمل النظام دون اتصال بالبوابة'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 6px">
        <div class="avatar" style="width:30px;height:30px;font-size:11.5px">م</div>
        <div style="display:flex;flex-direction:column">
          <span style="font-size:12.5px;font-weight:600">موظف الاستقبال</span>
          <button id="logout" style="font-size:11px;color:#0071E3;text-align:start">تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </aside>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 32px;background:#F5F5F7;position:sticky;top:0;z-index:20;border-bottom:1px solid #EDEDED">
      <h1 style="margin:0;font-size:19px;font-weight:600;line-height:1.2">${titles[S.screen] || ''}</h1>
      <div style="margin-inline-start:auto;display:flex;align-items:center;gap:10px">
        <label style="display:flex;align-items:center;gap:8px;background:#F9F9F9;border:1px solid #EDEDED;border-radius:6px;padding:0 12px;height:36px;width:262px">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="flex:none;color:#6E6E73"><path d="M8.25 13.5C11.1495 13.5 13.5 11.1495 13.5 8.25C13.5 5.35051 11.1495 3 8.25 3C5.35051 3 3 5.35051 3 8.25C3 11.1495 5.35051 13.5 8.25 13.5Z" stroke="currentColor" stroke-width="1.7"></path><path d="M13.351 12.149L12.149 13.351L14.399 15.601L15.601 14.399L13.351 12.149Z" fill="currentColor"></path></svg>
          <input id="search" placeholder="ابحث باسم العضو أو رقم البطاقة" value="${esc(S.q)}" style="all:unset;flex:1;min-width:0;font-size:13px;color:#1D1D1F">
        </label>
        <button id="goAdd" class="pillbtn blue" style="display:flex;align-items:center;gap:8px;padding:0 18px;height:36px;font-size:13.5px;transition:background 300ms">
          <svg width="13" height="13" viewBox="0 0 15 16" fill="none"><path d="M7.5 14.5L7.5 1.5M1 8L14 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
          <span>عضو جديد</span>
        </button>
      </div>
    </header>
    <div style="flex:1;min-width:0;overflow-x:auto;padding:28px 32px 48px">${content()}</div>
  </main>
</div>
${S.unlink ? unlinkModal() : ''}${S.freeze ? freezeModal() : ''}${S.edit ? editModal() : ''}`;
  wireCommon(); wireScreen();
}

function content() {
  switch (S.screen) {
    case 'dash': return dashView();
    case 'members': return membersView();
    case 'profile': return profileView();
    case 'add': return addView();
    case 'cards': return cardsView();
    case 'renew': return renewView();
  }
  return '';
}
function wireCommon() {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
  $('goAdd').onclick = () => go('add');
  $('logout').onclick = () => { localStorage.removeItem('zc3_gym_key'); go('login'); };
  const s = $('search');
  s.onkeydown = (e) => { if (e.key === 'Enter') { S.q = s.value; go('members'); } };
}
function stopTimers() { if (S.gateTimer) { clearInterval(S.gateTimer); S.gateTimer = null; }
  if (S._scanTimer) { clearInterval(S._scanTimer); S._scanTimer = null; }
  if (S._sse) { S._sse.close(); S._sse = null; } }

/* ================= login ================= */
function loginView() {
  const sum = S.summary;
  return `
<div style="min-height:100vh;display:grid;grid-template-columns:1fr 1fr">
  <div style="background:#1D1D1F;color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:34px;height:34px;border-radius:10px;background:#fff;color:#1D1D1F;display:grid;place-items:center;font-size:15px;font-weight:700">ن</div>
      <span style="font-size:15px;font-weight:600">نادي المنارة</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px;max-width:420px">
      <span style="font-size:40px;font-weight:600;line-height:1.25">اشتراك واحد، بطاقة واحدة، وسجل دخول كامل.</span>
      <span style="font-size:16px;color:rgba(255,255,255,.6);line-height:1.7">نظام إدارة الاشتراكات والدخول الإلكتروني — يربط كل بطاقة بصاحبها ويسجّل كل حركة عند البوابة.</span>
    </div>
    <div style="display:flex;gap:44px;font-size:13px;color:rgba(255,255,255,.5)">
      <div style="display:flex;flex-direction:column;gap:5px"><span style="font-size:22px;font-weight:600;color:#fff">${sum?fmtN(sum.active_members):'—'}</span><span>عضو نشط</span></div>
      <div style="display:flex;flex-direction:column;gap:5px"><span style="font-size:22px;font-weight:600;color:#fff">${sum?fmtN(sum.today_entries):'—'}</span><span>دخول اليوم</span></div>
      <div style="display:flex;flex-direction:column;gap:5px"><span style="font-size:22px;font-weight:600;color:#fff">1</span><span>بوابة متصلة</span></div>
    </div>
  </div>
  <div style="display:grid;place-items:center;padding:48px">
    <div style="width:100%;max-width:372px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:27px;font-weight:600;line-height:1.2">تسجيل الدخول</span>
        <span style="font-size:13.5px;color:#6E6E73">للموظفين المصرح لهم فقط.</span>
      </div>
      <label class="field"><span>اسم الموظف</span><input id="loginUser" style="height:44px" placeholder="موظف الاستقبال"></label>
      <label class="field"><span>مفتاح الدخول (API Key)</span><input id="loginPass" type="password" style="height:44px" placeholder="اتركه فارغاً إذا لم يُضبط مفتاح"></label>
      <div id="loginErr" style="display:none;font-size:12.5px;color:#E85F46;font-weight:600"></div>
      <button id="loginBtn" class="pillbtn blue" style="height:44px;font-size:14px">دخول</button>
      <button id="gateBtn" class="pillbtn gray" style="height:42px;font-size:13.5px">تشغيل شاشة البوابة</button>
    </div>
  </div>
</div>`;
}
function wireLogin() {
  const attempt = async () => {
    const k = $('loginPass').value.trim();
    if (k) localStorage.setItem('zc3_gym_key', k); else localStorage.removeItem('zc3_gym_key');
    try {
      const res = await fetch('/gym/summary', {headers: k ? {Authorization:'Bearer '+k} : {}});
      if (res.status === 401) { $('loginErr').style.display = 'block'; $('loginErr').textContent = 'مفتاح غير صحيح'; return; }
      S.summary = await res.json(); await loadCommon(); go('dash');
    } catch { $('loginErr').style.display = 'block'; $('loginErr').textContent = 'تعذر الاتصال بالخادم'; }
  };
  $('loginBtn').onclick = attempt;
  $('loginPass').onkeydown = (e) => { if (e.key === 'Enter') attempt(); };
  $('gateBtn').onclick = () => go('gate');
  loadCommon().then(() => { if (S.screen === 'login') render(); }).catch(()=>{});
}

/* ================= dashboard ================= */
function dashView() {
  const sum = S.summary || {week:[], today_entries:0, active_members:0, expiring_week:0, revenue_today:0, payments_today:0};
  const weekTotal = (sum.week||[]).reduce((a,d)=>a+d.count,0);
  const max = Math.max(10, ...(sum.week||[]).map(d=>d.count));
  const stats = [
    ['دخول اليوم', fmtN(sum.today_entries), 'عبر البوابة الرئيسية', '#518339'],
    ['أعضاء نشطون', fmtN(sum.active_members), 'من أصل '+fmtN(sum.total_members)+' عضو', '#518339'],
    ['تنتهي هذا الأسبوع', fmtN(sum.expiring_week), 'تحتاج تنبيه تجديد', '#0071E3'],
    ['إيراد اليوم', fmtN(sum.revenue_today), 'د.ع · '+fmtN(sum.payments_today)+' عملية', '#6E6E73'],
  ];
  return `
<div style="display:flex;flex-direction:column;gap:20px;min-width:1000px;max-width:1320px">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
    ${stats.map(([l,v,n,t]) => `<div class="card" style="padding:20px 22px;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12.5px;font-weight:600;color:#6E6E73">${l}</div>
      <div style="font-size:34px;font-weight:600;line-height:1">${v}</div>
      <div style="font-size:12px;font-weight:600;color:${t}">${n}</div>
    </div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start">
    <div class="card" style="padding:22px 24px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px">
        <h2 style="margin:0;font-size:15.5px;font-weight:600">حركة الدخول خلال الأسبوع</h2>
        <span style="font-size:12px;color:#6E6E73">${fmtN(weekTotal)} دخول</span>
      </div>
      <div style="display:flex;align-items:flex-end;gap:14px;height:190px">
        ${(sum.week||[]).map(d => { const day = AR.day[new Date(d.date+'T12:00:00').getDay()];
          const h = Math.max(3, Math.round((d.count/max)*100));
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end">
            <span style="font-size:12px;font-weight:600;color:#6E6E73">${d.count}</span>
            <div style="width:100%;border-radius:8px;background:${d.count>=max*0.85&&d.count>0?'#0071E3':'#CFE4FA'};height:${h}%"></div>
            <span style="font-size:12px;color:#6E6E73">${day}</span>
          </div>`; }).join('')}
      </div>
    </div>
    <div class="card" style="padding:22px 24px;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <h2 style="margin:0;font-size:15.5px;font-weight:600">مسح مباشر عند البوابة</h2>

function heatmap() {
  const fills = ['#EDEDED','#CFE4FA','#9CC9F5','#4C9DEC','#0071E3'];
  const days = S.attendance || [];
  if (!days.length) return '<div style="font-size:12.5px;color:#6E6E73">لا بيانات حضور بعد.</div>';
  // Columns = weeks, rows = Sat..Fri per the design.
  const cells = []; let col = [];
  const rowOf = (d) => (new Date(d+'T12:00:00').getDay() + 1) % 7; // Sat=0 .. Fri=6
  days.forEach(d => { const r = rowOf(d.date);
    if (r === 0 && col.length) { cells.push(col); col = []; }
    if (!col.length) for (let i = 0; i < r; i++) col.push(null);
    col.push(d); });
  if (col.length) cells.push(col);
  const lv = (c) => c === 0 ? 0 : c === 1 ? 2 : c === 2 ? 3 : 4;
  return `
<div style="display:flex;gap:10px;align-items:flex-start">
  <div style="display:grid;grid-template-rows:repeat(7,15px);gap:5px;font-size:10.5px;color:#6E6E73;padding-top:1px">
    <span>سبت</span><span></span><span>اثنين</span><span></span><span>أربعاء</span><span></span><span>جمعة</span>
  </div>
  <div style="display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;grid-auto-columns:15px;gap:5px">
    ${cells.map(w => { let h = ''; for (let i = 0; i < 7; i++) { const d = w[i];
        h += d ? `<div title="${d.date} · ${d.count?d.count+' زيارة':'لا زيارة'}" style="border-radius:3px;background:${fills[lv(d.count)]}"></div>`
               : '<div style="border-radius:3px;background:transparent"></div>'; } return h; }).join('')}
  </div>
</div>
<div style="display:flex;align-items:center;gap:8px;margin-top:18px;font-size:11.5px;color:#6E6E73">
  <span>أقل</span>${fills.map(f => `<span style="width:13px;height:13px;border-radius:3px;background:${f}"></span>`).join('')}<span>أكثر</span>
</div>`;
}

function wireAdd() {
  let gender = '';
  const paint = () => {
    const gm = $('gM'), gf = $('gF'); if (!gm) return;
    gm.textContent = 'ذكر'; gf.textContent = 'أنثى';
    const on = 'background:#0071E3;color:#fff', off = 'background:#F9F9F9;border:1px solid #EDEDED;color:#6E6E73';
    gm.style.cssText += ';border-radius:60px;' + (gender==='male'?on:off);
    gf.style.cssText += ';border-radius:60px;' + (gender==='female'?on:off);
  };
  paint();
  $('gM').onclick = () => { gender = gender==='male'?'':'male'; paint(); };
  $('gF').onclick = () => { gender = gender==='female'?'':'female'; paint(); };
  const refresh = () => {
    $('mVal').textContent = S.months;
    const t = S.priceEdited || S.months * perMonth();
    $('fPrice').value = fmtN(t); $('pTotal').textContent = fmtN(t) + ' د.ع';
    $('pEnd').textContent = planEnd($('fStart').value, S.months);
  };
  $('mMinus').onclick = () => { S.months = Math.max(1, S.months-1); S.priceEdited = 0; refresh(); };
  $('mPlus').onclick = () => { S.months = Math.min(24, S.months+1); S.priceEdited = 0; refresh(); };
  $('fPrice').onchange = () => { S.priceEdited = +($('fPrice').value.replace(/[^\d]/g,'')) || 0; refresh(); };
  $('fStart').onchange = refresh;
  document.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { S.access = b.dataset.acc; S.priceEdited = 0;
    $('accRow').innerHTML = accessPills(); refresh(); wireAccRow(); });
  const wireAccRow = () => document.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { S.access = b.dataset.acc; S.priceEdited = 0; $('accRow').innerHTML = accessPills(); refresh(); wireAccRow(); });
  wireScan();
  $('cancelAdd').onclick = () => go('dash');
  $('saveAdd').onclick = async () => {
    const name = $('fName').value.trim();
    if (!name) { toast('الاسم مطلوب', true); return; }
    try {
      const body = {
        name, phone: $('fPhone').value, birth_date: $('fBirth').value, gender,
        address: $('fAddr').value, emergency: $('fEmg').value, health: $('fHealth').value,
        card_no: S.pendingCard,
        plan: { months: S.months, access: S.access, pay_method: S.pay,
          price: +($('fPrice').value.replace(/[^\d]/g,'')) || 0, start: $('fStart').value },
      };
      const r = await api('/gym/members', {method:'POST', body: JSON.stringify(body)});
      toast(r.panel_synced ? 'حُفظ العضو وفُعّلت البطاقة' : 'حُفظ العضو (البوابة غير متصلة)');
      go('profile', r.member.id);
    } catch (e) { toast(e.message, true); }
  };
}
function wireScan() {
  const rewire = () => {
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on('simScan', async () => { const serial = String(100000000 + Math.floor(Math.random()*900000000));
      try { await api('/gym/simulate', {method:'POST', body: JSON.stringify({card_no: serial, dry_run: true})}); } catch {} });
    on('resetScan', async () => { S.pendingCard = ''; S.scan = null; await api('/gym/scan', {method:'DELETE'}).catch(()=>{});
      $('scanBox').innerHTML = scanPanel(); rewire(); });
    on('useScan', () => { S.pendingCard = S.scan.card_no; $('scanBox').innerHTML = scanPanel(); rewire(); });
  };
  rewire();
  S._scanTimer = setInterval(async () => {
    if (S.pendingCard) return;
    try { const r = await api('/gym/scan');
      const had = !!S.scan; S.scan = r.waiting ? null : r.scan;
      if (!!S.scan !== had || (S.scan && r.scan && S.scan.card_no !== (r.scan||{}).card_no)) { $('scanBox').innerHTML = scanPanel(); rewire(); }
    } catch {}
  }, 1500);
}

    try { const u = JSON.parse(e.data);
      S.gateData = u;
      S.gate = u.result === 'granted' ? 'granted' : u.result === 'warn' ? 'warn' : u.result === 'unknown' ? 'unknown' : 'denied';
      const b = $('gateBody'); if (b) b.innerHTML = gateBody();
      if (idleT) clearTimeout(idleT);
      idleT = setTimeout(() => { S.gate = 'idle'; S.gateData = null; const b2 = $('gateBody'); if (b2) b2.innerHTML = gateBody(); }, 8000);
    } catch {}
  });
}

/* ================= wiring dispatch ================= */
function wireScreen() {
  wireModals();
  switch (S.screen) {
    case 'dash': wireDash(); break;
    case 'members': wireMembers(); break;
    case 'profile': wireProfile(); break;
    case 'add': wireAdd(); break;
    case 'cards': wireCards(); break;
    case 'renew': wireRenew(); break;
  }
}

/* ================= boot ================= */
(async function boot() {
  try {
    const res = await fetch('/gym/summary', {headers: key() ? {Authorization:'Bearer '+key()} : {}});
    if (res.ok) { S.summary = await res.json(); await loadCommon(); go('dash'); return; }
  } catch {}
  go('login');
})();
</script>
