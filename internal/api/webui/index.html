<!DOCTYPE html>

<style>

body{margin:0;background:#F5F5F7;font-family:"IBM Plex Sans Arabic",sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}

button{all:unset;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #0071E3;outline-offset:1px}

.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin 700ms linear infinite;display:inline-block;vertical-align:middle}

.stmt-preset{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;border:1.5px solid #EDEDED;font-size:13px;font-weight:600;text-align:center}

.pk-btn{all:unset;box-sizing:border-box;width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F9F9F9;border:1px solid #EDEDED;border-radius:6px;padding:0 12px;font-size:13.5px;color:#1D1D1F;cursor:pointer;transition:border-color 200ms,box-shadow 200ms,background 200ms}
.pk-btn:hover{border-color:#D2D2D7;background:#fff}
.pk-btn.open,.pk-btn:focus-visible{border-color:#0071E3;background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.pk-btn>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pk-btn.open svg.pk-chev{transform:rotate(180deg)}
.pk-pop{position:fixed;z-index:300;background:#fff;border:1px solid #EDEDED;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);padding:6px;max-height:320px;overflow:auto;animation:pkIn 140ms ease-out;scrollbar-width:none}
@keyframes pkIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.pk-opt{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:#1D1D1F;cursor:pointer;transition:background 120ms}
.pk-opt:hover,.pk-opt.active{background:#F5F5F7}
.pk-opt.sel{color:#0071E3;font-weight:600}
.pk-cal{width:292px;padding:12px}

.pk-dow{font-size:10.5px;font-weight:600;color:#6E6E73;text-align:center;padding:4px 0 6px}

.pk-day:hover{background:#F5F5F7}

.pk-link:hover{background:#E8F4FD}

<body>
<div id="app"></div>
<script>
'use strict';
/* ================= state & helpers ================= */
const S = {
  screen: 'login', memberId: null, tab: 'all', evTab: 'الكل',
  months: 3, access: 'gym_classes', pay: 'cash', discount: 0, priceEdited: 0,
  scan: null, pendingCard: '', unlink: false, freeze: false, edit: false,
  q: '', cfg: null, gymcfg: null, summary: null, members: [], member: null,
  cards: [], feed: [], attendance: [], history: [],
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (n) => Number(n || 0).toLocaleString('en-US');
// Old servers are protected by an API key kept in the browser; servers with
// sign-in (S.secure) use an HttpOnly session cookie instead and never expose a key to the page.
const key = () => S.secure ? '' : (localStorage.getItem('zc3_gym_key') || '');
const AR = {
  status: {active:'نشط', expiring:'ينتهي قريباً', expired:'منتهٍ', frozen:'مجمّد', none:'بلا اشتراك'},
  access: {gym:'صالة فقط', gym_classes:'صالة + حصص', full:'كامل الوصول'},
  pay: {cash:'نقد', card:'بطاقة مصرفية', transfer:'تحويل'},
  cardStatus: {linked:'مرتبطة', blank:'فارغة', suspended:'موقوفة', lost:'مفقودة'},
  result: {granted:'مسموح', warn:'تنبيه', denied:'مرفوض', unknown:'مرفوض'},
  day: ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],
};
const statusChip = (s) => ({active:['#D8F3C9','#1D1D1F'], expiring:['#E8F4FD','#0071E3'], expired:['#FFF5F5','#E85F46'], frozen:['#E8E8ED','#6E6E73'], none:['#E8E8ED','#6E6E73']}[s] || ['#E8E8ED','#6E6E73']);
const resultChip = (r) => ({granted:['#D8F3C9','#1D1D1F'], warn:['#E8F4FD','#0071E3'], denied:['#FFF5F5','#E85F46'], unknown:['#FFF5F5','#E85F46']}[r] || ['#E8E8ED','#6E6E73']);
const cardChip = (s) => ({linked:['#D8F3C9','#1D1D1F'], blank:['#E8F4FD','#0071E3'], suspended:['#E8E8ED','#6E6E73'], lost:['#FFF5F5','#E85F46']}[s] || ['#E8E8ED','#6E6E73']);
const initials = (name) => { const p = String(name||'').trim().split(/\s+/); if (!p[0]) return '—'; return p.length>1 ? p[0][0]+'.'+p[p.length-1][0] : p[0][0]; };
const dmy = (iso) => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d) || d.getFullYear() < 1980) return '—'; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
const hm = (iso) => { const d = new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const when = (iso) => { const d = new Date(iso), t = new Date(); const same = (a,b)=>a.toDateString()===b.toDateString(); const y = new Date(t); y.setDate(t.getDate()-1); if (same(d,t)) return 'اليوم '+hm(iso); if (same(d,y)) return 'أمس '+hm(iso); return dmy(iso); };
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
// End of a subscription once its current freeze is lifted (mirrors store.Unfreeze).
const effectiveEnd = (sub) => { const e = new Date(sub.end); if (sub.frozen_at) e.setDate(e.getDate() + Math.floor((Date.now() - new Date(sub.frozen_at))/864e5) + 1); return e; };
const serial4 = (s) => { s = String(s||''); return s.length>4 ? s.replace(/(\d{4})(?=\d)/g,'$1 · ') : s; };
const photoURL = (id) => '/gym/members/'+encodeURIComponent(id)+'/photo'+(key()?'?api_key='+encodeURIComponent(key())+'&':'?')+'t='+Date.now();
const scaleToJpeg = (dataURL, maxW) => new Promise((res, rej) => {
  const img = new Image();
  img.onerror = () => rej(new Error('ملف صورة غير صالح'));
  img.onload = () => { const sc = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width*sc)); c.height = Math.max(1, Math.round(img.height*sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', 0.85)); };
  img.src = dataURL;
});
const fileToJpeg = (file, maxW) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = () => rej(new Error('تعذر قراءة الملف'));
  r.onload = () => scaleToJpeg(r.result, maxW).then(res, rej);
  r.readAsDataURL(file);
});
const stopStream = () => { if (S._stream) { S._stream.getTracks().forEach(t => t.stop()); S._stream = null; } };

let liveGen = 0; // bumped by every write; a background refresh started before it is discarded
async function api(path, opts={}) {
  if (opts.method && opts.method !== 'GET') liveGen++;

function passwordScore(pw, user) {
  if (!pw) return 0;
  let score = pw.length >= 8 ? 1 : 0;
  if (pw.length >= 12) score++;
  if (/[a-z\u0600-\u06FF]/i.test(pw) && /\d/.test(pw)) score++;
  if (/[^\w\u0600-\u06FF]/.test(pw)) score++;
  if (user && pw.toLowerCase().includes(user.toLowerCase())) score = Math.min(score, 1);
  return Math.min(4, score);
}

/* ================= member calendar: visits, exits and events ================= */
// Iraqi week starts on Saturday. Day counts come from /attendance (52 weeks);
// swipes (entries, exits, refusals) from the member's check-in history; payments
// and plan / card / freeze changes from the member record.
const DOW_SAT = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
const MONTHS_SHORT = ['كانون ٢','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين ١','تشرين ٢','كانون ١'];
const ATT_FILLS = ['#EDEDED','#CFE4FA','#9CC9F5','#4C9DEC','#0071E3'];
const attLevel = (c) => c <= 0 ? 0 : c === 1 ? 2 : c === 2 ? 3 : 4;
const dayKey = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const keyDate = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const satOf = (d) => addDays(d, -((d.getDay() + 1) % 7));
const ddmm = (d) => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
const plural = (n, one, many) => n === 1 ? one : n + ' ' + many;
const EV_CATS = ['الكل','الدخول','المدفوعات','الخطة','مرفوض'];
// Event tones reuse the app's status colors; every event also carries a glyph + label.
const EV_TONE = {'الدخول': ['#0071E3','#E8F4FD'], 'المدفوعات': ['#518339','#D8F3C9'], 'الخطة': ['#1D1D1F','#E8E8ED'], 'مرفوض': ['#E85F46','#FFF5F5']};
const INSIDE_MAX_H = 4; // without an exit swipe, a visit counts as over after 4 hours
const quantile = (sorted, q) => { if (!sorted.length) return null; const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); };
const fmtDur = (min) => { if (min == null || isNaN(min)) return '—'; min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? h + ':' + String(m).padStart(2, '0') + ' س' : m + ' د'; };
const fmtClock = (min) => { min = ((Math.round(min) % 1440) + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); };
const fmtNum1 = (x) => x == null ? '—' : (Math.round(x * 10) / 10).toString();
const okSwipe = (c) => c.result === 'granted' || c.result === 'warn';

// Pairs each entry with the member's next exit (within 16 h) into visits.
// An exit swipe counts even if refused: the member was leaving.
function buildVisits(checkins) {
  const rows = checkins.filter(c => c.member_id).slice().sort((a, b) => new Date(a.time) - new Date(b.time));
  const open = new Map(), visits = [];
  for (const c of rows) {
    const t = new Date(c.time);
    if (c.direction === 'out') {
      const v = open.get(c.member_id);
      if (v && t - v.in <= 16 * 3600e3) { v.out = t; open.delete(c.member_id); }
      continue;
    }
    if (!okSwipe(c)) continue;
    const v = {member: c.member_id, name: c.name, card: c.card_no, in: t, out: null};
    open.set(c.member_id, v); visits.push(v);
  }
  return visits;
}
const visitMinutes = (v) => v.out ? (v.out - v.in) / 60000 : null;
// Members inside right now: their latest entry has no exit and is less than INSIDE_MAX_H old.
function insideNow(checkins, now = new Date()) {
  const recent = checkins.filter(c => now - new Date(c.time) < 24 * 3600e3);
  const latest = new Map();
  buildVisits(recent).forEach(v => latest.set(v.member, v));
  return [...latest.values()].filter(v => !v.out && now - v.in < INSIDE_MAX_H * 3600e3).sort((a, b) => b.in - a.in);
}

function memberEvents(m) {
  const hist = S.history || [];
  const visits = new Map(buildVisits(hist).map(v => [v.in.getTime(), v]));
  const evs = [];
  hist.forEach(c => {
    const t = new Date(c.time);
    if (c.direction === 'out') evs.push({cat: 'الدخول', t, glyph: '→', label: 'خروج', meta: 'بطاقة ' + serial4(c.card_no)});
    else if (okSwipe(c)) {
      const v = visits.get(t.getTime());
      evs.push({cat: 'الدخول', t, glyph: '←', label: 'دخول', entry: true,
        meta: v && v.out ? 'خرج ' + hm(v.out.toISOString()) + ' · بقي ' + fmtDur(visitMinutes(v)) : 'بطاقة ' + serial4(c.card_no)});
    } else evs.push({cat: 'مرفوض', t, glyph: '×', label: 'دخول مرفوض', meta: c.reason || ''});
  });
  (m.payments || []).forEach(p => evs.push({cat: 'المدفوعات', t: new Date(p.time), glyph: 'ع', label: p.note || 'دفعة',
    meta: fmtN(p.amount) + ' د.ع · ' + (AR.pay[p.method] || p.method) + ' · وصل #' + p.receipt}));
  (m.log || []).forEach(l => { if (l.kind === 'plan' || l.kind === 'freeze' || l.kind === 'card')
    evs.push({cat: 'الخطة', t: new Date(l.time), glyph: l.kind === 'freeze' ? '‖' : (l.kind === 'card' ? '▮' : '⇅'), label: l.label, meta: l.meta}); });
  return evs.sort((a, b) => b.t - a.t);
}

function attModel() {
  const m = S.member || {};
  const counts = new Map((S.attendance || []).map(d => [d.date, d.count]));
  const events = memberEvents(m);
  const byDay = new Map();
  events.forEach(e => { const k = dayKey(e.t); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const first = S.attendance && S.attendance.length ? keyDate(S.attendance[0].date) : today;
  let last = null;
  for (let d = today; d >= first; d = addDays(d, -1)) if (counts.get(dayKey(d))) { last = d; break; }
  const filter = S.evTab || 'الكل';
  const dayEvents = (d) => (byDay.get(dayKey(d)) || []).filter(e => filter === 'الكل' || e.cat === filter).sort((a, b) => a.t - b.t);
  // Heat value of a day: visits for الكل / الدخول, otherwise the number of events of that kind.
  const value = (d) => filter === 'الكل' || filter === 'الدخول' ? (counts.get(dayKey(d)) || 0) : dayEvents(d).length;
  return {counts, events, byDay, today, first, last, filter, dayEvents, value, count: (d) => counts.get(dayKey(d)) || 0};
}
function attStats(A, from, to) {
  let visits = 0, days = 0, elapsed = 0, run = 0, best = 0;
  for (let d = from; d <= to && d <= A.today; d = addDays(d, 1)) {
    const c = A.count(d); elapsed++; visits += c;
    if (c) { days++; run++; best = Math.max(best, run); } else run = 0;

function memberHabits(m, A) {

  const visits = buildVisits(S.history || []).filter(v => v.in >= since);
  const durs = visits.map(visitMinutes).filter(x => x != null && x > 0).sort((a, b) => a - b);
  const entries = visits.map(v => v.in.getHours() * 60 + v.in.getMinutes()).sort((a, b) => a - b);
  // Count weeks / months from the member's first recorded visit: joining earlier
  // than the swipe history (e.g. members entered after the system went live) must not add zeros.
  let firstVisit = null;
  for (let d = A.first; d <= A.today; d = addDays(d, 1)) if (A.count(d)) { firstVisit = d; break; }

// Documents open in an in-app preview first (the Windows print dialog cannot show
// one), then print from the preview frame.
function printHTML(html, title = 'معاينة الطباعة', paper = 'a4') {
  document.querySelectorAll('.pv-bg').forEach(x => x.remove());
  const bg = document.createElement('div');
  bg.className = 'pv-bg';
  bg.setAttribute('role', 'dialog'); bg.setAttribute('aria-label', title);
  const width = paper === 'receipt' ? 340 : 820;
  bg.innerHTML = `
    <div class="pv-bar">
      <span style="font-size:15px;font-weight:600">${esc(title)}</span>
      <span style="font-size:12px;color:rgba(255,255,255,.6)">هذا ما سيُطبع</span>
      <button type="button" class="pillbtn gray" data-pv="close" style="margin-inline-start:auto;height:36px;padding:0 18px;font-size:13px">إغلاق</button>
      <button type="button" class="pillbtn blue" data-pv="print" style="height:36px;padding:0 22px;font-size:13px">🖨 طباعة</button>
    </div>
    <div class="pv-body"><iframe class="pv-page" title="${esc(title)}" style="width:${width}px;height:1100px"></iframe></div>`;
  document.body.appendChild(bg);
  const frame = bg.querySelector('iframe');
  const doc = frame.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  const fit = () => { try { frame.style.height = Math.max(400, doc.documentElement.scrollHeight + 8) + 'px'; } catch {} };
  frame.onload = fit; setTimeout(fit, 150); setTimeout(fit, 800);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
  document.addEventListener('keydown', onKey, true);
  bg.querySelector('[data-pv="close"]').onclick = close;
  bg.querySelector('[data-pv="print"]').onclick = () => { frame.contentWindow.focus(); frame.contentWindow.print(); };
  bg.onclick = (e) => { if (e.target === bg) close(); };
}

function stmtRange() {

    case 'prev': { const f = new Date(t.getFullYear(), t.getMonth() - 1, 1); return {from: f, to: new Date(t.getFullYear(), t.getMonth(), 1), label: MONTHS_AR[f.getMonth()] + ' ' + f.getFullYear()}; }

const REV_KINDS = [['new', 'اشتراك جديد', '#0071E3'], ['renew', 'تجديد', '#eb6834'], ['other', 'أخرى', '#1baf7a']];

    out.push({from, to, label: MONTHS_SHORT[from.getMonth()] + ' – ' + MONTHS_SHORT[to.getMonth() === 0 ? 11 : to.getMonth() - 1] + ' ' + from.getFullYear()});

function statsModel() {

  const knownDur = visits.map(visitMinutes).filter(x => x > 0).sort((a, b) => a - b);
  const typical = quantile(knownDur, .5) || 90;
  // entries per weekday × hour, averaged per occurrence of that weekday in the range
  const heat = Array.from({length: 7}, () => Array(24).fill(0));
  visits.forEach(v => heat[(v.in.getDay() + 1) % 7][v.in.getHours()]++);
  const weekdayCount = Array(7).fill(0);
  for (let d = from; d <= today; d = addDays(d, 1)) weekdayCount[(d.getDay() + 1) % 7]++;
  const avgHeat = heat.map((row, r) => row.map(x => weekdayCount[r] ? x / weekdayCount[r] : 0));
  const byHour = Array(24).fill(0), byDay = Array(7).fill(0);
  visits.forEach(v => { byHour[v.in.getHours()]++; byDay[(v.in.getDay() + 1) % 7]++; });
  // average members inside per hour of day (exit time, or the typical stay when there is none)
  const insideMin = Array(24).fill(0), sweep = [];
  visits.forEach(v => {
    const a = v.in.getTime(), b = v.out ? v.out.getTime() : a + typical * 60000;
    sweep.push([a, 1], [b, -1]);
    for (let t = a; t < b;) {
      const d = new Date(t), next = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1).getTime();

    }

  sweep.forEach(([t, dlt]) => { cur += dlt; if (cur > peak) { peak = cur; peakAt = t; } });

    const payers = new Map();
    list.forEach(p => { sums[p.kind] += p.amount; const x = payers.get(p.member) || {id: p.member, name: p.name, deleted: !!p.deleted, amount: 0, n: 0}; x.amount += p.amount; x.n++; payers.set(p.member, x); });

function wireStats() {
  const os = $('openStmt'); if (os) os.onclick = () => { S.stmt = true; render(); };

    const redraw = () => render();
    document.querySelectorAll('[data-stp]').forEach(b => b.onclick = () => { S.stmtPreset = b.dataset.stp; redraw(); });
    const f = $('stFrom'), t = $('stTo');
    if (f) f.onchange = () => { S.stmtFrom = f.value; redraw(); };
    if (t) t.onchange = () => { S.stmtTo = t.value; redraw(); };
    $('stCancel').onclick = () => { S.stmt = false; render(); };
    $('stPrint').onclick = () => { const r = stmtRange(); S.stmt = false; render(); printHTML(statementHTML(r), 'كشف حساب الإيرادات · ' + r.label); };

  document.querySelectorAll('[data-srange]').forEach(b => b.onclick = () => { S.statsRange = +b.dataset.srange; render(); });
  document.querySelectorAll('[data-rhalf]').forEach(b => b.onclick = () => { S.revHalf = +b.dataset.rhalf; render(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('profile', b.dataset.open));
}

let vizTipEl = null;
function hideVizTip() { if (vizTipEl) vizTipEl.classList.remove('show'); }
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { hideVizTip(); return; }
  if (!vizTipEl) { vizTipEl = document.createElement('div'); vizTipEl.className = 'viz-tip'; document.body.appendChild(vizTipEl); }
  vizTipEl.textContent = t.dataset.tip;
  vizTipEl.classList.add('show');
});
document.addEventListener('mousemove', (e) => {
  if (!vizTipEl || !vizTipEl.classList.contains('show')) return;
  const w = vizTipEl.offsetWidth, h = vizTipEl.offsetHeight;
  vizTipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX - w / 2)) + 'px';
  vizTipEl.style.top = (e.clientY - h - 12 < 8 ? e.clientY + 18 : e.clientY - h - 12) + 'px';
});

    try { S.member = await api('/gym/members/'+S.memberId,

// Plans come from the server config; an older server without editable plans
// falls back to the three built-in ones and their legacy prices.
function allPlans() {
  const c = S.gymcfg || {};
  if (Array.isArray(c.plans) && c.plans.length) return c.plans;
  return [{key:'gym', name:AR.access.gym, price:c.price_gym||45000},
          {key:'gym_classes', name:AR.access.gym_classes, price:c.price_classes||45000},
          {key:'full', name:AR.access.full, price:c.price_full||55000}];
}
const livePlans = () => allPlans().filter(p => !p.deleted);
const planName = (key) => { const p = allPlans().find(p => p.key === key); return p ? p.name : (AR.access[key] || key || '—'); };
const plansEditable = () => !!(S.gymcfg && Array.isArray(S.gymcfg.plans));
// Keep the add/renew selection on a plan that is still for sale.
const ensureAccess = () => { const live = livePlans(); if (!live.some(p => p.key === S.access) && live.length) S.access = live[0].key; };
function perMonth() { const p = allPlans().find(p => p.key === S.access); return p ? p.price : 0; }
// Short passes: 24h, 3 and 7 days. Prices come from the plan; a plan without
// them falls back to the monthly price prorated at 1.5× per day (as the server does).
const DURS = [['d1', '24 ساعة', 1], ['d3', '3 أيام', 3], ['d7', '7 أيام', 7], ['m', 'شهري', 0]];
const passesOK = () => plansEditable();
const durDays = () => { const d = DURS.find(x => x[0] === S.dur); return d ? d[2] : 0; };
function passPrice(plan, days) {
  const own = plan[{1: 'price_1d', 3: 'price_3d', 7: 'price_7d'}[days]];
  if (own > 0) return own;
  const v = Math.floor(plan.price * days * 3 / 60);
  return Math.floor((v + 499) / 500) * 500;
}
function durPrice() {
  const d = durDays();
  if (!d) return S.months * perMonth();
  const plan = allPlans().find(x => x.key === S.access);
  return plan ? passPrice(plan, d) : 0;
}
const monthsLabel = (n) => n === 1 ? 'شهر' : n === 2 ? 'شهران' : n <= 10 ? n + ' أشهر' : n + ' شهراً';
const durLabel = () => { const d = durDays(); return d ? DURS.find(x => x[2] === d)[1] : monthsLabel(S.months); };
function durEnd(start) {
  const e = new Date(start), d = durDays();
  if (d) e.setTime(e.getTime() + d * 864e5); else e.setMonth(e.getMonth() + S.months);
  return e;
}
const subDurLabel = (sub) => sub.days ? (sub.days === 1 ? '24 ساعة' : sub.days + ' أيام') : monthsLabel(sub.months || 1);
function durationField() {

function wireDuration(onChange) {

        <div id="camPh" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#6E6E73">
          <div style="width:52px;height:52px;border-radius:50%;border:1.5px solid #D2D2D7;display:grid;place-items:center"><div style="width:22px;height:22px;border-radius:50%;border:1.5px solid #D2D2D7"></div></div>
          <div id="camHint" style="text-align:center;font-size:12px;line-height:1.6">جارٍ تشغيل الكاميرا…</div>
        </div>
      </div>

      const sc = Math.min(1, 800 / v.videoWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth*sc); c.height = Math.round(v.videoHeight*sc);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      S.photoData = c.toDataURL('image/jpeg', 0.85);
      stopStream(); wirePhotoBox();
    });
    const pf = $('photoFileAdd');
    if (pf) pf.onchange = async () => {
      const file = pf.files && pf.files[0]; if (!file) return;
      try { S.photoData = await fileToJpeg(file, 800); stopStream(); wirePhotoBox(); }
      catch (e) { toast(e.message, true); }
    };
    if (!S.photoData) startCam();
  };
  // Cameras: the choice is remembered; by default an external (USB) camera wins
  // over the laptop's built-in one. Labels are only readable after permission,
  // so the first stream may be re-opened on the preferred device.
  const CAM_KEY = 'gym_camera';
  const builtIn = (label) => /integrated|built-?in|\bir\b|infrared|internal|facetime|front|مدمجة/i.test(label || '');
  const savedCam = () => { try { return localStorage.getItem(CAM_KEY); } catch { return null; } };
  const listCams = async () => (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const preferredCam = (cams) => {
    const saved = savedCam();
    if (saved && cams.some(c => c.deviceId === saved)) return saved;
    const ext = cams.find(c => c.label && !builtIn(c.label));
    return ext ? ext.deviceId : (cams[0] ? cams[0].deviceId : null);
  };
  const openCam = (id) => navigator.mediaDevices.getUserMedia({video: id
    ? {deviceId: {exact: id}, width: {ideal: 1280}, height: {ideal: 720}}
    : {width: {ideal: 1280}, height: {ideal: 720}}});
  const attach = () => {
    const v = $('camVid'); if (!v) { stopStream(); return false; } // re-rendered while waiting
    v.srcObject = S._stream; v.style.display = '';
    const ph = $('camPh'); if (ph) ph.style.display = 'none';
    return true;
  };
  const camRow = (cams, current) => {
    const row = $('camRow'); if (!row) return;

    row.innerHTML = `<label class="field"><span>الكاميرا</span><select id="camSel">${cams.map((c, i) =>
      `<option value="${esc(c.deviceId)}" ${c.deviceId === current ? 'selected' : ''}>${esc((c.label || 'كاميرا ' + (i + 1)).replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '') + (builtIn(c.label) ? ' · مدمجة' : ''))}</option>`).join('')}</select></label>`;
    enhancePickers(row);
    $('camSel').onchange = async (e) => {
      const id = e.target.value;
      try { localStorage.setItem(CAM_KEY, id); } catch {}
      stopStream();
      const ph = $('camPh'), hint = $('camHint'), v = $('camVid');
      if (v) v.style.display = 'none';
      if (ph) ph.style.display = ''; if (hint) hint.textContent = 'جارٍ تشغيل الكاميرا…';
      try { S._stream = await openCam(id); attach(); }
      catch (err) { camError(err); }
    };
  };
  const camError = (err) => {
    const h = $('camHint'); if (!h) return;
    const why = {NotAllowedError: 'تم رفض إذن الكاميرا', NotFoundError: 'لا توجد كاميرا متصلة', NotReadableError: 'الكاميرا مستخدمة من برنامج آخر', OverconstrainedError: 'الكاميرا المختارة غير متصلة'}[err && err.name] || 'تعذر فتح الكاميرا';
    h.innerHTML = why + '<br><span style="font-weight:600">اختر كاميرا أخرى أو استخدم «رفع صورة»</span>';
  };
  const startCam = async () => {
    const v = $('camVid'), hint = $('camHint');
    if (!v) return;
    if (S._stream) { attach(); listCams().then(cams => camRow(cams, S._stream && S._stream.getVideoTracks()[0].getSettings().deviceId)).catch(() => {}); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (hint) hint.innerHTML = 'الكاميرا غير متاحة هنا<br><span style="font-weight:600">استخدم «رفع صورة»</span>'; return;
    }
    try {
      let cams = await listCams();
      const known = cams.every(c => c.label);
      S._stream = await openCam(known ? preferredCam(cams) : (cams.some(c => c.deviceId === savedCam()) ? savedCam() : null))
        .catch(() => openCam(null)); // a remembered camera that is unplugged: fall back to any
      cams = await listCams();
      const want = preferredCam(cams), cur = S._stream.getVideoTracks()[0].getSettings().deviceId;
      if (want && cur !== want) {
        stopStream();
        S._stream = await openCam(want).catch(() => openCam(null));
      }
      if (!attach()) return;
      camRow(cams, S._stream.getVideoTracks()[0].getSettings().deviceId);
    } catch (err) {
      camError(err);
      listCams().then(cams => camRow(cams, null)).catch(() => {});
    }
  };
  // Plugging / unplugging a camera while this screen is open.
  navigator.mediaDevices && (navigator.mediaDevices.ondevicechange = () => {
    if (S.screen !== 'add' || S.photoData || !$('camVid')) return;
    stopStream(); startCam();
  });
  wirePhotoBox();

  let gender = '';
  const paint = () => {
    const gm = $('gM'), gf = $('gF'); if (!gm) return;

    gm.style.cssText += ';border-radius:60px;' + (gender==='male'?on:off);

  const refresh = () => {

    const t = S.priceEdited || durPrice();
    $('fPrice').value = fmtN(t); $('pTotal').textContent = fmtN(t) + ' د.ع';

  wireDuration(refresh);

    $('accRow').innerHTML = accessPills(); refresh(); wireAccRow(); });

      go('profile', r.member.id);

function wireScan() {
  const rewire = () => {
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };

    on('resetScan', async () => { S.pendingCard = ''; S.scan = null; await api('/gym/scan', {method:'DELETE'}).catch(()=>{});
      $('scanBox').innerHTML = scanPanel(); rewire(); });
    on('useScan', () => { S.pendingCard = S.scan.card_no; $('scanBox').innerHTML = scanPanel(); rewire(); });
  };
  rewire();
  if (S._scanTimer) clearInterval(S._scanTimer);
  S._scanTimer = setInterval(async () => {
    if (S.pendingCard) return;
    try { const r = await api('/gym/scan');

      if (!!S.scan !== had || (S.scan && r.scan && S.scan.card_no !== (r.scan||{}).card_no)) { $('scanBox').innerHTML = scanPanel(); rewire(); }
    } catch {}
  }, 1500);
}

// Renewal chains from the current end (after any freeze credit), never earlier than today.
const renewStart = (m, sub) => { const now = new Date(); if (!sub || m.status === 'expired' || m.status === 'none') return now; const e = effectiveEnd(sub); return e > now ? e : now; };
function wireRenew() {
  const m = S.member; if (!m) return;
  const sub = m.subs && m.subs[m.subs.length-1];
  const startDate = () => renewStart(m, sub);
  const refresh = () => {
    const total = S.priceEdited || durPrice();
    const due = Math.max(0, total - S.discount);
    $('mVal').textContent = monthsLabel(S.months); $('sumMonths').textContent = durLabel();
    $('fPrice').value = fmtN(total); $('sumTotal').textContent = fmtN(total)+' د.ع';
    $('sumDisc').textContent = '−'+fmtN(S.discount)+' د.ع'; $('sumDue').textContent = fmtN(due)+' د.ع';
    const e = durEnd(startDate()).toISOString(); $('sumEnd').textContent = dmy(e) + (durDays() ? ' ' + hm(e) : '');
  };
  refresh();

  $('fPrice').onchange = () => { S.priceEdited = +($('fPrice').value.replace(/[^\d]/g,'')) || 0; refresh(); };
  $('fDisc').onchange = () => { S.discount = +($('fDisc').value.replace(/[^\d]/g,'')) || 0; refresh(); };
  const wireRows = () => {
    document.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { S.access = b.dataset.acc; S.priceEdited = 0; render(); wireScreen(); });
    document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { S.pay = b.dataset.pay; render(); wireScreen(); });
  };
  wireRows();
  $('doRenew').onclick = async () => {
    try {
      const body = { months: durDays() ? 0 : S.months, days: durDays(), access: S.access, pay_method: S.pay,
        price: S.priceEdited || durPrice(), discount: S.discount };
      S.member = await api('/gym/members/'+S.memberId+'/renew', {method:'POST', body: JSON.stringify(body)});

  };
}

const fileToPng = (file, max) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = () => rej(new Error('تعذر قراءة الملف'));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => rej(new Error('الملف ليس صورة'));
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/png'));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

/* ================= USB desk reader ================= */
// A USB card reader on this PC acts as a keyboard: it "types" the card number
// and presses Enter within a few ms. Keystrokes that arrive that fast are a
// scan, not a person typing; they feed the same scan slot as a gate swipe.
const usbReader = { buf: '', last: 0, target: null };
document.addEventListener('keydown', (e) => {
  if (S.screen === 'login' || e.ctrlKey || e.altKey || e.metaKey) return;
  const now = performance.now();
  if (now - usbReader.last > 60) usbReader.buf = '';
  usbReader.last = now;
  if (/^[0-9]$/.test(e.key)) { if (!usbReader.buf) usbReader.target = e.target; usbReader.buf += e.key; return; }
  if (e.key !== 'Enter' || usbReader.buf.length < 6) { usbReader.buf = ''; return; }
  const card = usbReader.buf, el = usbReader.target;
  usbReader.buf = '';
  e.preventDefault(); e.stopPropagation();
  // Undo the digits the reader typed into a focused field (except the card field itself).
  if (el && el.id !== 'lcSerial' && 'value' in el && String(el.value).endsWith(card)) el.value = el.value.slice(0, -card.length);
  onUsbScan(card);
}, true);
async function onUsbScan(raw) {
  const card = raw.replace(/^0+(?=\d)/, '');
  if (S.linkCard) {
    const inp = $('lcSerial'), st = $('lcScanState');
    if (inp) inp.value = card;
    if (st) st.textContent = 'بطاقة مكتشفة: ' + serial4(card);
  }
  try {
    await api('/gym/simulate', {method:'POST', body: JSON.stringify({card_no: card, scan_only: true})});
    const r = await api('/gym/scan');
    const sc = (!r.waiting && r.scan) || {card_no: card};
    if (S.linkCard) return;
    if (S.screen === 'add') { // attach straight away unless the card belongs to someone else
      S.scan = sc; S.pendingCard = sc.known ? '' : sc.card_no;
      const box = $('scanBox'); if (box) { box.innerHTML = scanPanel(); wireScan(); }
      return;
    }
    if (sc.member_id) go('profile', sc.member_id);
    else if (sc.known) { S.q = sc.member || card; go('members'); }
    else toast('بطاقة غير مرتبطة: ' + serial4(card), true);
  } catch (err) { toast(err.message, true); }
}

// Amount boxes: digits only, grouped as you type (35,000), caret kept in place,
// with the currency shown inside the box. Read them with moneyVal(id).
const moneyField = (id, value, placeholder = '0') =>
  `<div class="money"><input id="${id}" data-money inputmode="numeric" autocomplete="off" placeholder="${placeholder}" value="${value || value === 0 ? fmtN(value) : ''}"><span>دينار عراقي</span></div>`;
const moneyVal = (id) => { const el = $(id); return el ? Number((el.value || '').replace(/\D/g, '')) || 0 : 0; };
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.matches || !el.matches('input[data-money]')) return;
  const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
  const before = el.value.slice(0, pos).replace(/\D/g, '').length;
  const digits = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 12);
  const out = digits ? Number(digits).toLocaleString('en-US') : '';
  el.value = out;
  let i = 0;
  for (let seen = 0; i < out.length && seen < before; i++) if (/\d/.test(out[i])) seen++;
  el.setSelectionRange(i, i);
}, true);

function wireDateBoxes(root) {
  root.querySelectorAll('.dbox:not([data-wired])').forEach(box => {
    box.dataset.wired = '1';
    const parts = [...box.querySelectorAll('[data-part]')], hidden = box.querySelector('input[type=hidden]');
    const sync = () => {
      const [d, m, y] = parts.map(x => x.value);
      box.classList.remove('bad');
      if (!d && !m && !y) { hidden.value = ''; return; }
      const dt = new Date(+y, +m - 1, +d);
      const ok = y.length === 4 && +y >= 1900 && dt <= new Date() && dt.getFullYear() === +y && dt.getMonth() === +m - 1 && dt.getDate() === +d;
      hidden.value = ok ? y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0') : '';
      if (!ok && d && m && y.length === 4) box.classList.add('bad');
    };
    parts.forEach((el, i) => {
      el.oninput = () => {
        el.value = el.value.replace(/\D/g, '').slice(0, el.maxLength);
        if (el.value.length === el.maxLength && parts[i + 1]) parts[i + 1].focus();
        sync();
      };
      el.onkeydown = (e) => { if (e.key === 'Backspace' && !el.value && parts[i - 1]) { e.preventDefault(); parts[i - 1].focus(); } };
      el.onblur = () => { if (el.dataset.part !== 'y' && el.value.length === 1 && el.value !== '0') { el.value = '0' + el.value; sync(); } };
    });
    sync();
  });
}

    let left = r.right - w;
    if (left < 8) left = Math.min(r.left, innerWidth - w - 8);
    let top = r.bottom + 6;
    if (top + h > innerHeight - 8 && r.top - h - 6 >= 8) top = r.top - h - 6;
    pop.style.left = Math.max(8, left) + 'px';
    pop.style.top = Math.max(8, top) + 'px';
  };
  place();
  pop.style.visibility = '';
  btn.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
  const onDown = (e) => { if (!pop.contains(e.target) && !btn.contains(e.target)) closePicker(); };
  const onKeyDown = (e) => {
    if (e.key === 'Escape' || e.key === 'Tab') { if (e.key === 'Escape') e.preventDefault(); closePicker(); btn.focus(); return; }
    if (onKey) onKey(e);
  };
  // Follow the field while the page scrolls; close once it leaves the screen.
  const onScroll = (e) => {
    if (pop.contains(e.target)) return;
    const r = btn.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) closePicker(); else place();
  };
  document.addEventListener('mousedown', onDown, true);
  document.addEventListener('keydown', onKeyDown, true);
  window.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', closePicker);
  openPicker = {pop, btn, place, detach: () => {
    document.removeEventListener('mousedown', onDown, true);
    document.removeEventListener('keydown', onKeyDown, true);
    window.removeEventListener('scroll', onScroll, true);
    window.removeEventListener('resize', closePicker);
  }};
}
function pickerButton(native) {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'pk-btn';
  btn.setAttribute('aria-haspopup', 'true'); btn.setAttribute('aria-expanded', 'false');
  native.dataset.pk = '1';
  native.style.display = 'none';
  native.before(btn);
  return btn;
}

function enhanceSelect(sel) {
  const btn = pickerButton(sel);
  const paint = () => { const o = sel.options[sel.selectedIndex]; btn.innerHTML = `<span>${esc(o ? o.text : '')}</span>${ICON_CHEV}`; };
  paint();
  sel.addEventListener('change', paint);
  btn.onclick = () => {
    if (openPicker && openPicker.btn === btn) { closePicker(); return; }
    const pop = document.createElement('div');
    pop.className = 'pk-pop'; pop.setAttribute('role', 'listbox');
    pop.innerHTML = [...sel.options].map((o, i) => `<button type="button" role="option" class="pk-opt${i === sel.selectedIndex ? ' sel active' : ''}" data-i="${i}"><span>${esc(o.text)}</span>${i === sel.selectedIndex ? ICON_CHECK : ''}</button>`).join('');
    let active = Math.max(0, sel.selectedIndex);
    const opts = [...pop.querySelectorAll('.pk-opt')];
    const setActive = (i) => { opts[active] && opts[active].classList.remove('active'); active = i; opts[i].classList.add('active'); opts[i].scrollIntoView({block: 'nearest'}); };
    const pick = (i) => {
      if (sel.selectedIndex !== i) { sel.selectedIndex = i; sel.dispatchEvent(new Event('change', {bubbles: true})); }
      closePicker(); btn.focus();
    };
    opts.forEach((b, i) => { b.onclick = () => pick(i); b.onmousemove = () => { if (active !== i) setActive(i); }; });
    showPopover(btn, pop, (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); setActive((active + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(active); }
    });
  };
  btn.onkeydown = (e) => { if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !openPicker) { e.preventDefault(); btn.click(); } };
}

function enhanceDate(inp) {
  const btn = pickerButton(inp);
  const parse = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const paint = () => {
    const d = parse(inp.value);
    btn.innerHTML = `<span style="${d ? '' : 'color:#6E6E73'}">${d ? String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() : 'اختر التاريخ'}</span>${ICON_CAL}`;
  };
  paint();
  inp.addEventListener('change', paint);
  const set = (d) => {
    inp.value = iso(d);
    inp.dispatchEvent(new Event('input', {bubbles: true}));
    inp.dispatchEvent(new Event('change', {bubbles: true}));
  };
  btn.onclick = () => {
    if (openPicker && openPicker.btn === btn) { closePicker(); return; }
    const chosen = parse(inp.value) || new Date();
    let view = new Date(chosen.getFullYear(), chosen.getMonth(), 1);
    let focus = new Date(chosen.getFullYear(), chosen.getMonth(), chosen.getDate());
    const pop = document.createElement('div');
    pop.className = 'pk-pop pk-cal'; pop.setAttribute('role', 'dialog');
    const draw = () => {
      const y = view.getFullYear(), m = view.getMonth();
      const lead = new Date(y, m, 1).getDay(); // weeks start on Sunday (أحد)
      const days = [];
      for (let i = 0; i < 42; i++) days.push(new Date(y, m, 1 - lead + i));
      if (days[35].getMonth() !== m) days.length = 35;
      const today = todayISO(), selIso = inp.value, focusIso = iso(focus);
      pop.innerHTML = `
        <div class="pk-cal-head">
          <button type="button" class="pk-nav" data-step="-1" aria-label="الشهر السابق">${ICON_PREV}</button>
          <span class="pk-cal-title">${MONTHS_AR[m]} ${y}</span>
          <button type="button" class="pk-nav" data-step="1" aria-label="الشهر التالي">${ICON_NEXT}</button>
        </div>
        <div class="pk-grid">
          ${AR.day.map(d => `<span class="pk-dow">${d}</span>`).join('')}
          ${days.map(d => { const k = iso(d);
            return `<button type="button" class="pk-day${d.getMonth() !== m ? ' muted' : ''}${k === today ? ' today' : ''}${k === selIso ? ' sel' : ''}" data-d="${k}"${k === focusIso ? ' data-focus="1"' : ''}>${d.getDate()}</button>`; }).join('')}
        </div>
        <div class="pk-cal-foot">
          <button type="button" class="pk-link" data-today="1">اليوم</button>
          <span style="font-size:11.5px;color:#6E6E73">${selIso ? selIso.split('-').reverse().join('/') : ''}</span>
        </div>`;
      pop.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { view = new Date(y, m + +b.dataset.step, 1); focus = new Date(view); draw(); });
      pop.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { set(parse(b.dataset.d)); closePicker(); btn.focus(); });
      pop.querySelector('[data-today]').onclick = () => { set(new Date()); closePicker(); btn.focus(); };
      const f = pop.querySelector('[data-focus]'); if (f) f.style.outline = '2px solid rgba(0,113,227,.35)';
      if (openPicker && openPicker.pop === pop) openPicker.place();
    };
    draw();
    showPopover(btn, pop, (e) => {
      // RTL: ArrowRight goes back a day, ArrowLeft forward.
      const step = {ArrowRight: -1, ArrowLeft: 1, ArrowUp: -7, ArrowDown: 7}[e.key];
      if (step) {
        e.preventDefault();
        focus = new Date(focus.getFullYear(), focus.getMonth(), focus.getDate() + step);
        if (focus.getMonth() !== view.getMonth() || focus.getFullYear() !== view.getFullYear()) view = new Date(focus.getFullYear(), focus.getMonth(), 1);
        draw();
      } else if (e.key === 'Enter') { e.preventDefault(); set(focus); closePicker(); btn.focus(); }
    });
  };
}

function enhancePickers(root) {
  root.querySelectorAll('select:not([data-pk])').forEach(enhanceSelect);
  root.querySelectorAll('input[type="date"]:not([data-pk])').forEach(enhanceDate);
}

/* ================= live updates ================= */
// Keeps the open screen current with no refresh: gate swipes arrive instantly
// over SSE, and a light poll picks up edits made in another window (browser vs
// Windows app) or on another PC. It re-renders only when the data really
// changed, and never while the user is typing, in a dialog, or on a form.
const LIVE_POLL_MS = 3000;
const LIVE_KEYS = ['cfg','summary','feed','members','member','attendance','history','gatesData','gymcfg','recent','payments','business'];
const liveSnap = () => JSON.stringify(LIVE_KEYS.map(k => S[k] ?? null));
function userBusy() {
  if (S.screen === 'login' || S.screen === 'setup' || S.screen === 'add' || S.screen === 'renew') return true; // forms keep their input
  if (S.acctDirty || S.bizDirty || S.stmt || document.querySelector('.pv-bg')) return true;
  if (S.unlink || S.freeze || S.edit || S.linkCard || document.querySelector('.modal-bg')) return true;
  if (S.planEdit || S.planAdd || S.planGatesDirty || S.addFromScan != null) return true;
  if (openPicker) return true; // a dropdown / calendar is open
  if (S.delMember) return true; // unsaved plan changes on the settings page
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable));
}
let liveRunning = false;
async function liveRefresh() {
  if (liveRunning || document.hidden || userBusy()) return;
  // Statistics read the whole swipe history: refresh them at most every 30 s.
  if (S.screen === 'stats' && Date.now() - (S._statsAt || 0) < 30000) return;
  if (S.screen === 'stats') S._statsAt = Date.now();
  liveRunning = true;
  const screen = S.screen, id = S.memberId, gen = liveGen;
  try {
    const patch = await fetchScreen(screen, id);
    if (S.screen !== screen || S.memberId !== id || liveGen !== gen || userBusy()) return;
    const before = liveSnap();
    Object.assign(S, patch);
    if (liveSnap() !== before) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch {} finally { liveRunning = false; }
}
function startLive() {
  if (S._live && S._liveKey === key()) return;
  if (S._live) S._live.close();
  S._liveKey = key();
  S._live = new EventSource('/gym/gate' + (key() ? '?api_key=' + encodeURIComponent(key()) : ''));
  // The dashboard patches its feed in place from its own stream; other screens refetch.
  S._live.addEventListener('gate', () => { if (S.screen !== 'dash') liveRefresh(); });
  if (!S._livePoll) {
    S._livePoll = setInterval(liveRefresh, LIVE_POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) liveRefresh(); });
    window.addEventListener('focus', liveRefresh);
  }
}

/* ================= boot ================= */
(async function boot() {
  try {
    // Servers with sign-in answer /auth/status; older ones do not (API key mode).
    const res = await fetch('/auth/status', {cache: 'no-store'});
    const st = res.ok ? await res.json().catch(() => null) : null;
    if (st && typeof st.activated === 'boolean') {
      S.secure = true; S.auth = st;
      if (!st.activated || !st.configured) { go('setup'); return; }
      if (!st.authenticated) { go('login'); return; }
      await loadCommon(); startLive(); const r = startRoute(); go(r.screen, r.id); return;
    }
    const legacy = await fetch('/gym/summary', {headers: key() ? {Authorization: 'Bearer ' + key()} : {}});
    if (legacy.ok) { S.summary = await legacy.json(); await loadCommon(); startLive(); const r = startRoute(); go(r.screen, r.id); return; }
  } catch {}
  go('login');
})();
</script>
